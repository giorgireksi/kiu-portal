    (function loadIndexMobileShellCss() {
        var coreHref = 'assets/css/mobile-shell-core.css?v=20260819-sidebarperf2';
        var polishHref = 'assets/css/mobile-shell.css?v=20260724-chromeshare1';
        function injectOne(href, flag) {
            if (document.querySelector('link[' + flag + ']')) return;
            var existing = Array.prototype.some.call(document.querySelectorAll('link[rel="stylesheet"]'), function (l) {
                return String(l.getAttribute('href') || '').indexOf(href.split('?')[0].split('/').pop()) !== -1;
            });
            if (existing) return;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            link.fetchPriority = 'high';
            link.setAttribute(flag, '1');
            document.head.appendChild(link);
        }
        function inject() {
            injectOne(coreHref, 'data-kiu-mobile-shell-core-css');
            injectOne(polishHref, 'data-kiu-mobile-shell-css');
        }
        var mobileQuery = typeof window.matchMedia === 'function'
            ? window.matchMedia('(max-width: 1024px)')
            : null;
        if (!mobileQuery || mobileQuery.matches) {
            inject();
            return;
        }
        var onChange = function (event) {
            if (!event.matches) return;
            inject();
            if (typeof mobileQuery.removeEventListener === 'function') {
                mobileQuery.removeEventListener('change', onChange);
            } else if (typeof mobileQuery.removeListener === 'function') {
                mobileQuery.removeListener(onChange);
            }
        };
        if (typeof mobileQuery.addEventListener === 'function') {
            mobileQuery.addEventListener('change', onChange);
        } else if (typeof mobileQuery.addListener === 'function') {
            mobileQuery.addListener(onChange);
        }
    })();
    </script>

(function loadIndexMobileShell() {
    'use strict';

    var scriptId = 'index-mobile-shell-script';
    var scriptSrc = 'assets/js/pages/index-mobile-shell.js?v=20260809-homeassembly1';

    function injectScript() {
        if (document.getElementById(scriptId)) return;
        var script = document.createElement('script');

        script.defer = true;
        script.src = scriptSrc;
        document.body.appendChild(script);
    }

    var mobileQuery = typeof window.matchMedia === 'function'
        ? window.matchMedia('(max-width: 1024px)')
        : null;

    if (!mobileQuery || mobileQuery.matches) {
        injectScript();
        return;
    }

    var handleViewportChange = function (event) {
        if (!event.matches) return;
        injectScript();
        if (typeof mobileQuery.removeEventListener === 'function') {
            mobileQuery.removeEventListener('change', handleViewportChange);
        } else if (typeof mobileQuery.removeListener === 'function') {
            mobileQuery.removeListener(handleViewportChange);
        }
    };

    if (typeof mobileQuery.addEventListener === 'function') {
        mobileQuery.addEventListener('change', handleViewportChange);
    } else if (typeof mobileQuery.addListener === 'function') {
        mobileQuery.addListener(handleViewportChange);
    }
})();
</script>
