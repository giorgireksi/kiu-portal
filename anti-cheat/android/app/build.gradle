plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def releaseKeystoreFile = (System.getenv('KIU_ANDROID_RELEASE_STORE_FILE') ?: project.findProperty('KIU_ANDROID_RELEASE_STORE_FILE') ?: '').toString().trim()
def releaseKeystorePassword = (System.getenv('KIU_ANDROID_RELEASE_STORE_PASSWORD') ?: project.findProperty('KIU_ANDROID_RELEASE_STORE_PASSWORD') ?: '').toString().trim()
def releaseKeyAlias = (System.getenv('KIU_ANDROID_RELEASE_KEY_ALIAS') ?: project.findProperty('KIU_ANDROID_RELEASE_KEY_ALIAS') ?: '').toString().trim()
def releaseKeyPassword = (System.getenv('KIU_ANDROID_RELEASE_KEY_PASSWORD') ?: project.findProperty('KIU_ANDROID_RELEASE_KEY_PASSWORD') ?: '').toString().trim()

android {
    namespace = 'com.anticheat.browser'
    compileSdk = 34

    defaultConfig {
        applicationId "com.anticheat.browser"
        minSdk = 24
        targetSdk = 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
}
