(function deferTimetableLocalization() {
    // Timetable labels are already English in the static shell. Keep a tiny
    // fallback for the first render, then load the large localization table
    // only after the timetable's assembly work is idle.
    window.localizeHtmlMarkup = window.localizeHtmlMarkup || (value => String(value ?? ''));
    window.toEnglishText = window.toEnglishText || (value => String(value ?? ''));
    window.cleanupEncodingArtifacts = window.cleanupEncodingArtifacts || (value => String(value ?? ''));
    const load = () => {
        if (document.querySelector('script[data-timetable-localization]')) return;
        const script = document.createElement('script');
        script.defer = true;
        script.dataset.timetableLocalization = '1';
        script.src = 'assets/js/app/english-localization.js?v=20260816-timetable-idle1';
        document.head.appendChild(script);
    };
    // Expose this for an explicit language/encoding refresh, but do not spend
    // a weak device's first idle window parsing the large localization table.
    window.__kiuLoadTimetableLocalization = load;
}());

<script defer>
function bindTimetableStaticControls() {
    if (window.__timetableStaticControlsBound) return;
    window.__timetableStaticControlsBound = true;

    document.addEventListener('click', (event) => {
        const toggle = event.target instanceof Element
            ? event.target.closest('[data-timetable-toggle-command]')
            : null;
        if (!toggle) return;
        event.preventDefault();
        if (typeof window.toggleTimetableCommandTools === 'function') {
            window.toggleTimetableCommandTools(toggle);
        }
    });
}

function ensureTimetableRouteReady() {
    bindTimetableStaticControls();
    if (typeof renderTimetable === 'function') {
        renderTimetable();
    }
}

function initStandaloneTimetableRoute() {
    if (typeof window.bootStandaloneDesktopRoute !== 'function') {
        ensureTimetableRouteReady();
        return;
    }
    const bootKey = 'timetable::timetable';
    if (window.__kiuStandaloneDesktopRouteBootKey === bootKey) {
        ensureTimetableRouteReady();
        return;
    }
    window.bootStandaloneDesktopRoute({
        entryId: 'timetable',
        pageId: 'timetable',
        family: 'faculty',
        beforeBoot: () => {
            const fac = localStorage.getItem('currentFaculty') || 'ECON';
            if (typeof switchFacultyTheme === 'function') {
                switchFacultyTheme(fac, { refreshDependentViews: false });
            }
            bindTimetableStaticControls();
        },
        renderContent: () => {
            if (typeof renderTimetable === 'function') {
                renderTimetable();
            }
        },
        routeRefresh: () => {
            if (typeof renderTimetable === 'function') {
                renderTimetable();
            }
        }
    });
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStandaloneTimetableRoute, { once: true });
} else {
    initStandaloneTimetableRoute();
}
</script>
