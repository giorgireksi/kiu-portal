server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index login.html index.html;

    location ~* ^/admin-tools-standalone(\.dom)?\.html$ {
        return 404;
    }

    location ^~ /artifacts/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }
}
