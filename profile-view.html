<template id="pv-session-modal-template">
    <div id="pv-session-modal" class="pv-modal-overlay" data-pv-modal-overlay>
        <div class="pv-modal-card surface-card pv-modal-card--session">
            <div class="pv-modal-header">
                <div>
                    <div class="pv-modal-title" data-pv-session-title><i class="fas fa-calendar-plus"></i> New Class Session</div>
                    <div class="pv-modal-subtitle" data-pv-session-subtitle></div>
                </div>
                <i class="fas fa-times pv-modal-close" data-pv-remove-target="pv-session-modal"></i>
            </div>
            <div class="pv-modal-form" id="pv-session-form">
                <div class="pv-modal-grid-session-subject">
                    <div><label class="pvsm-lbl">Subject <span class="pv-inline-required">*</span></label><select id="pvs-subject" class="pv-modal-input lux-control"></select></div>
                    <div><label class="pvsm-lbl">Group ID <span class="pv-inline-required">*</span></label><input id="pvs-group" type="text" class="pv-modal-input lux-control" placeholder="e.g. G1"></div>
                </div>
                <div class="pv-modal-grid-two">
                    <div><label class="pvsm-lbl">Day</label><select id="pvs-day" class="pv-modal-input lux-control"></select></div>
                    <div><label class="pvsm-lbl">Room</label><input id="pvs-room" type="text" class="pv-modal-input lux-control" placeholder="e.g. A-101"></div>
                </div>
                <div class="pv-modal-grid-three">
                    <div><label class="pvsm-lbl">Start Time</label><input id="pvs-time" type="time" class="pv-modal-input lux-control" step="60" data-pv-session-sync="start"></div>
                    <div><label class="pvsm-lbl">Duration</label><select id="pvs-duration" class="pv-modal-input lux-control" data-pv-session-sync="start"><option value="50">50min</option><option value="80">80min</option><option value="110" selected>~2h (110 min)</option><option value="170">~3h (170 min)</option></select></div>
                    <div><label class="pvsm-lbl">End Time</label><select id="pvs-endtime" class="pv-modal-input lux-control" data-pv-session-sync="end"></select></div>
                </div>
                <div class="pv-modal-grid-two">
                    <div><label class="pvsm-lbl">Professor <span class="pv-inline-optional">(optional)</span></label><select id="pvs-prof" class="pv-modal-input lux-control"><option value="">No professor</option></select></div>
                    <div><label class="pvsm-lbl">Teaching Assistant <span class="pv-inline-optional">(optional)</span></label><select id="pvs-ta" class="pv-modal-input lux-control"><option value="">No teaching assistant</option></select></div>
                </div>
                <div class="pv-modal-grid-capacity">
                    <div><label class="pvsm-lbl">Capacity</label><input id="pvs-capacity" type="number" class="pv-modal-input lux-control" value="40" min="1" max="200"></div>
                    <div><label class="pvsm-lbl">Active Faculty (auto)</label><input id="pvs-faculty-name" type="text" class="pv-modal-input pv-readonly-input lux-control" readonly></div>
                </div>
                <div><label class="pvsm-lbl">Apply Changes To</label><select id="pvs-scope" class="pv-modal-input lux-control"><option value="selected-week">Selected week only</option><option value="recurring">Recurring template</option></select></div>
            </div>
            <div class="pv-modal-footer">
                <button type="button" class="lux-primary-btn pv-modal-submit" data-pv-action="create-session"><i class="fas fa-plus-circle"></i> Create Session &amp; Deploy</button>
            </div>
        </div>
    </div>
</template>

<template id="pv-editgroup-modal-template">
    <div id="pv-editgroup-modal" class="pv-modal-overlay" data-pv-modal-overlay>
        <div class="pv-modal-card surface-card pv-modal-card--group">
            <div class="pv-modal-header pv-modal-header--compact">
                <div><div class="pv-modal-title" data-pv-group-title><i class="fas fa-edit"></i> Edit Group</div><div class="pv-modal-subtitle" data-pv-group-subtitle></div></div>
                <i class="fas fa-times pv-modal-close" data-pv-remove-target="pv-editgroup-modal"></i>
            </div>
            <div class="pv-modal-form pv-modal-form--compact" id="pv-eg-form">
                <div class="pv-modal-grid-two">
                    <div><label class="peg-lbl">Day</label><select id="peg-day" class="pv-group-input lux-control"></select></div>
                    <div><label class="peg-lbl">Room</label><input id="peg-room" type="text" class="pv-group-input lux-control"></div>
                </div>
                <div class="pv-modal-grid-three">
                    <div><label class="peg-lbl">Start Time</label><select id="peg-time" class="pv-group-input lux-control"></select></div>
                    <div><label class="peg-lbl">Duration</label><select id="peg-dur" class="pv-group-input lux-control"></select></div>
                    <div><label class="peg-lbl">End Time</label><select id="peg-endtime" class="pv-group-input lux-control"></select></div>
                </div>
                <div class="pv-modal-grid-group-people">
                    <div><label class="peg-lbl">Capacity</label><input id="peg-cap" type="number" class="pv-group-input lux-control" min="1" max="200"></div>
                    <div><label class="peg-lbl">Professor</label><select id="peg-prof" class="pv-group-input lux-control"><option value="">No professor</option></select></div>
                    <div><label class="peg-lbl">TA</label><select id="peg-ta" class="pv-group-input lux-control"><option value="">No teaching assistant</option></select></div>
                </div>
            </div>
            <div class="pv-modal-footer pv-modal-footer--compact">
                <button type="button" class="lux-primary-btn pv-modal-submit" data-pv-action="save-group-edit"><i class="fas fa-save"></i> Save Group Changes</button>
            </div>
        </div>
    </div>
</template>

<template id="pv-schedule-row-template">
    <div class="prof-sched-edit-row pv-schedule-edit-row">
        <div><label class="pv-schedule-field-label">SUBJECT</label><input type="text" class="ps-course pv-schedule-field-input" placeholder="ECON-01-101"></div>
        <div><label class="pv-schedule-field-label">GROUP</label><input type="text" class="ps-group pv-schedule-field-input" value="G1"></div>
        <div><label class="pv-schedule-field-label">DAY</label><select class="ps-day pv-schedule-field-select"></select></div>
        <div><label class="pv-schedule-field-label">ROOM</label><input type="text" class="ps-room pv-schedule-field-input" placeholder="A-301"></div>
        <div><label class="pv-schedule-field-label">TIME</label><input type="time" class="ps-time pv-schedule-field-input pv-schedule-field-input--time" value="09:00"></div>
        <div><label class="pv-schedule-field-label">DUR</label><select class="ps-dur pv-schedule-field-select"><option>50min</option><option>80min</option><option selected>110min</option><option>170min</option></select></div>
        <div><button type="button" aria-label="Remove schedule row" data-pv-action="remove-schedule-row" class="pv-schedule-remove-btn"><i class="fas fa-trash-alt"></i></button></div>
    </div>
</template>
