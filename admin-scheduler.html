<!-- CREATE SESSION MODAL -->
<template id="sch-modal-template">
    <div class="sch-modal-overlay" id="schModalOverlay" data-admin-scheduler-modal-overlay="true" data-lux-transparency-exempt="1" data-sch-session-modal-ssot="1" hidden aria-hidden="true">
        <div class="sch-modal" role="dialog" aria-modal="true" aria-labelledby="sch-modal-title">
            <div class="sch-modal-head sch-modal-head-accent">
                <div>
                    <div class="sch-modal-mode-chip" id="sch-modal-mode-chip">Create</div>
                    <div class="sch-modal-title" id="sch-modal-title"><i class="fas fa-calendar-plus" aria-hidden="true"></i> New Class Session</div>
                    <div class="sch-modal-subtitle" id="sch-modal-subtitle">Monday 09:00</div>
                    <div class="sch-modal-week" id="sch-modal-week">Week of …</div>
                </div>
                <i class="fas fa-times sch-modal-close-muted" data-admin-scheduler-modal-close="true" role="button" tabindex="0" aria-label="Close"></i>
            </div>
            <div class="sch-modal-body">
                <div class="sch-conflict-alert" id="sch-conflict-msg" data-conflict-state="hidden" role="status" aria-live="polite" hidden><i class="fas fa-circle-info" id="sch-conflict-icon"></i> <span id="sch-conflict-text"></span></div>

                <section class="sch-form-section sch-form-section--identity">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Session Basics</div>
                        <div class="sch-form-section-copy">Choose the subject and group this session belongs to.</div>
                    </div>
                    <div class="sch-input-row sch-input-row-subject">
                        <div class="sch-input-group">
                            <div class="sch-input-label-row">
                                <label for="sch-subject" id="sch-subject-field-label">Subject <span class="sch-inline-required">*</span></label>
                                <span class="sch-input-label-spacer" aria-hidden="true"></span>
                            </div>
                            <select class="lux-control" id="sch-subject" name="sch-subject" data-lux-picker-label="Subject"></select>
                        </div>
                        <div class="sch-input-group">
                            <div class="sch-input-label-row">
                                <label for="sch-group" id="sch-group-field-label">Group ID <span class="sch-inline-required">*</span></label>
                                <button type="button" class="sch-preset-manage-link" data-scheduler-preset-manage="group" data-lux-skip-modern-button="true"><i class="fas fa-sliders-h" aria-hidden="true"></i> Manage groups</button>
                            </div>
                            <select class="lux-control" id="sch-group" name="sch-group" data-scheduler-preset-kind="group" data-lux-picker-label="Group ID" aria-label="Group ID"></select>
                        </div>
                    </div>
                </section>

                <section class="sch-form-section sch-form-section--schedule">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Time And Room</div>
                        <div class="sch-form-section-copy">Place the session on the calendar and reserve the room.</div>
                    </div>
                    <div class="sch-input-row sch-input-row-two">
                        <div class="sch-input-group">
                            <label for="sch-day" id="sch-day-field-label">Day</label>
                            <select class="lux-control" id="sch-day" name="sch-day" data-lux-picker-label="Day">
                                <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                                <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
                            </select>
                        </div>
                        <div class="sch-input-group">
                            <div class="sch-input-label-row">
                                <label for="sch-room" id="sch-room-field-label">Room</label>
                                <button type="button" class="sch-preset-manage-link" data-scheduler-preset-manage="room" data-lux-skip-modern-button="true"><i class="fas fa-sliders-h" aria-hidden="true"></i> Manage rooms</button>
                            </div>
                            <select class="lux-control" id="sch-room" name="sch-room" data-scheduler-preset-kind="room" data-lux-picker-label="Room"></select>
                        </div>
                    </div>

                    <div class="sch-input-row sch-input-row-three">
                        <div class="sch-input-group">
                            <label for="sch-time">Start Time</label>
                            <input type="time" class="lux-control" id="sch-time" name="sch-time" value="09:00" step="60" data-admin-scheduler-session-field="time">
                        </div>
                        <div class="sch-input-group">
                            <label for="sch-duration" id="sch-duration-field-label">Duration</label>
                            <select class="lux-control" id="sch-duration" name="sch-duration" data-admin-scheduler-session-field="duration" data-lux-picker-label="Duration">
                                <option value="custom">Custom</option>
                                <option value="60">1h (60 min)</option>
                                <option value="90">1.5h (90 min)</option>
                                <option value="110" selected>~2h (110 min)</option>
                                <option value="120">2h (120 min)</option>
                                <option value="150">2.5h (150 min)</option>
                                <option value="180">3h (180 min)</option>
                            </select>
                        </div>
                        <div class="sch-input-group">
                            <label for="sch-endtime">End Time</label>
                            <input type="time" class="lux-control" id="sch-endtime" name="sch-endtime" data-admin-scheduler-session-field="endtime" required>
                        </div>
                    </div>
                </section>

                <section class="sch-form-section sch-form-section--staffing">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Staffing</div>
                        <div class="sch-form-section-copy">Choose lecture or seminar and assign a professor or TA.</div>
                    </div>
                    <div class="sch-input-row sch-input-row-single">
                        <div class="sch-input-group">
                            <label for="sch-session-type" id="sch-session-type-field-label">Session type</label>
                            <select class="lux-control" id="sch-session-type" name="sch-session-type" data-admin-scheduler-session-field="session-type" data-lux-picker-label="Session type">
                                <option value="lecture">Lecture</option>
                                <option value="seminar">Seminar (TA-led)</option>
                            </select>
                        </div>
                    </div>
                    <div class="sch-input-row sch-input-row-two">
                        <div class="sch-input-group">
                            <label for="sch-prof" id="sch-prof-field-label">Professor</label>
                            <select class="lux-control" id="sch-prof" name="sch-prof" data-admin-scheduler-session-field="prof" data-lux-picker-label="Professor">
                                <option value="">No professor</option>
                            </select>
                        </div>
                        <div class="sch-input-group">
                            <label for="sch-ta" id="sch-ta-field-label">Teaching assistant</label>
                            <select class="lux-control" id="sch-ta" name="sch-ta" data-admin-scheduler-session-field="ta" data-lux-picker-label="Teaching assistant">
                                <option value="">No TA</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="sch-form-section sch-form-section--scope">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Capacity And Scope</div>
                        <div class="sch-form-section-copy">Set attendance limits and choose whether the change is week-only or recurring.</div>
                    </div>
                    <div class="sch-input-row sch-input-row-capacity">
                        <div class="sch-input-group">
                            <label for="sch-capacity">Capacity</label>
                            <input type="number" class="lux-control" id="sch-capacity" name="sch-capacity" value="40" min="1" max="200">
                        </div>
                        <div class="sch-input-group">
                            <label for="sch-faculty-display">Active Faculty (auto)</label>
                            <input type="text" class="lux-control sch-input-readonly" id="sch-faculty-display" name="sch-faculty-display" readonly>
                        </div>
                    </div>
                    <div class="sch-input-row sch-input-row-single">
                        <div class="sch-input-group">
                            <label for="sch-apply-scope" id="sch-apply-scope-field-label">Apply Changes To</label>
                            <select class="lux-control" id="sch-apply-scope" name="sch-apply-scope" data-lux-picker-label="Apply Changes To">
                                <option value="selected-week">Selected week only</option>
                                <option value="recurring">Recurring template</option>
                            </select>
                        </div>
                    </div>
                </section>

                <input type="hidden" id="sch-semester-hidden" name="sch-semester-hidden">
                <input type="hidden" id="sch-weekstart-hidden" name="sch-weekstart-hidden">
                <input type="hidden" id="sch-edit-mode" name="sch-edit-mode" value="create">
                <input type="hidden" id="sch-edit-course" name="sch-edit-course">
                <input type="hidden" id="sch-edit-group" name="sch-edit-group">
                <input type="hidden" id="sch-edit-weekstart" name="sch-edit-weekstart">
                <input type="hidden" id="sch-edit-was-override" name="sch-edit-was-override" value="0">
            </div>
            <div class="sch-modal-foot">
                <button type="button" class="lux-primary-btn sch-create-btn" id="sch-create-btn" data-admin-scheduler-session-action="create"><i class="fas fa-plus-circle"></i> Create Session &amp; Deploy</button>
            </div>
        </div>
    </div>
</template>
<!-- MANAGE SCHEDULER PRESETS (groups / rooms) -->
<template id="sch-preset-manager-template">
    <div class="sch-modal-overlay" id="schPresetManagerOverlay" data-admin-scheduler-preset-overlay="true" data-lux-transparency-exempt="1" hidden>
        <div class="sch-modal sch-modal-narrow">
            <div class="sch-modal-head">
                <div>
                    <div class="sch-modal-mode-chip home-hover-chip" id="sch-preset-manage-chip">Presets</div>
                    <div class="sch-modal-title" id="sch-preset-manage-title"><i class="fas fa-users"></i> Manage Groups</div>
                    <div class="sch-modal-subtitle" id="sch-preset-manage-subtitle">Add, search, or remove groups from pickers.</div>
                </div>
                <button type="button" class="lux-secondary-btn sch-modal-close-muted home-hover-chip" data-admin-scheduler-preset-close="true" data-lux-skip-modern-button="true" aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <div class="sch-modal-body sch-modal-body-pad">
                <div class="sch-form-section home-hover-chip">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Search</div>
                    </div>
                    <div class="sch-search-shell">
                        <i class="fas fa-search"></i>
                        <input type="search" id="sch-preset-search" class="lux-control sch-preset-manage-search" placeholder="Filter presets..." autocomplete="off">
                    </div>
                </div>
                <div class="sch-form-section home-hover-chip">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">All presets</div>
                        <div class="sch-form-section-copy"><strong id="sch-preset-manage-count">0</strong> shown</div>
                    </div>
                    <p class="sch-preset-manage-helper">Remove deletes saved names or built-in defaults from pickers.</p>
                    <div class="sch-preset-manage-list-shell">
                        <div id="sch-preset-list" class="sch-preset-manage-list" role="list"></div>
                        <div id="sch-preset-manage-empty" class="sch-empty-state lux-summary-surface lux-summary-surface--panel home-hover-chip" hidden>No presets match your search.</div>
                    </div>
                </div>
                <div class="sch-form-section home-hover-chip">
                    <div class="sch-form-section-head">
                        <div class="sch-form-section-title">Add preset</div>
                    </div>
                    <div class="sch-preset-manage-add-row">
                        <input type="text" id="sch-preset-manage-draft" class="lux-control sch-combo-save-input" placeholder="New group" autocomplete="off">
                        <button type="button" class="lux-primary-btn sch-preset-manage-add-btn" data-scheduler-preset-add="true">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                </div>
            </div>
            <div class="sch-modal-foot sch-modal-foot-between">
                <button type="button" class="lux-secondary-btn" data-admin-scheduler-preset-close="true">Cancel</button>
                <button type="button" class="lux-primary-btn" data-admin-scheduler-preset-done="true">Done</button>
            </div>
        </div>
    </div>
</template>
