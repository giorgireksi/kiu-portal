<script>
/* Pre-configure admin role + ensure page renders on load */
(function() {
    function bindStaticModalClosers() {
        var overlay = document.getElementById('modal-overlay');
        if (!overlay || overlay.dataset.modalClosersBound === '1') return;
        overlay.addEventListener('click', function(event) {
            var closeTrigger = event.target.closest('[data-close-modal="true"]');
            if (!closeTrigger && event.target !== overlay) return;
            if (typeof closeAllModals === 'function') {
                closeAllModals(event);
            }
        });
        overlay.dataset.modalClosersBound = '1';
    }

    function redirectUnauthorizedAdminToolsAccess() {
        var effectiveRole = typeof getEffectiveUserRole === 'function'
            ? getEffectiveUserRole()
            : (localStorage.getItem('currentUserRole') || 'student');
        if (typeof getAllowedPagesForRole === 'function') {
            var allowedPages = getAllowedPagesForRole(effectiveRole);
            if (!allowedPages || !allowedPages.has('admin-tools')) {
                var redirectUrl = typeof resolvePortalRouteUrl === 'function'
                    ? resolvePortalRouteUrl('home', effectiveRole)
                    : 'index.html';
                window.location.replace(redirectUrl);
                return true;
            }
        }
        return false;
    }

    function tryRenderAdminTools() {
        if (redirectUnauthorizedAdminToolsAccess()) return;
        bindStaticModalClosers();
        if (typeof renderLuxuryAdminToolsPage === 'function') {
            renderLuxuryAdminToolsPage();
            return true;
        }
        return false;
    }

    function bootAdminTools() {
        if (tryRenderAdminTools()) return;
        window.addEventListener('load', tryRenderAdminTools, { once: true });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootAdminTools);
    } else { bootAdminTools(); }
})();
</script>
