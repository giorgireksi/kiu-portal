<script>
/* Pre-configure admin role + ensure page renders on load */
(function() {
    function bindStaticModalClosers() {
        var overlay = document.getElementById('modal-overlay');
        if (!overlay || overlay.dataset.modalClosersBound === '1') return;
        overlay.addEventListener('click', function(event) {
            var closeTrigger = event.target.closest('[data-close-modal="true"]');
            if (!closeTrigger && event.target !== overlay) return;
            if (typeof closeAllModals === 'function') {
                closeAllModals(event);
            }
        });
        overlay.dataset.modalClosersBound = '1';
    }

    function scheduleAdminToolsDashboardMounts() {}

    function canAccessAdminToolsWorkspace() {
        if (typeof userHasPortalPrivilegeForAuthUser === 'function') {
            return userHasPortalPrivilegeForAuthUser('access_admin_tools');
        }
        var authRole = typeof currentUser !== 'undefined' && currentUser
            ? String(currentUser.role || '').trim().toLowerCase()
            : '';
        return authRole === 'admin';
    }

    function redirectUnauthorizedAdminToolsAccess() {
        if (canAccessAdminToolsWorkspace()) return false;
        var hasSessionToken = typeof getPortalSessionToken === 'function' && !!getPortalSessionToken();
        if (hasSessionToken && !(typeof currentUser !== 'undefined' && currentUser)) {
            return false;
        }
        var redirectUrl = 'login.html';
        if (typeof resolvePortalRouteUrl === 'function') {
            redirectUrl = resolvePortalRouteUrl('home', 'admin');
        } else {
            redirectUrl = 'index.html?view=admin#home';
        }
        window.location.replace(redirectUrl);
        return true;
    }

    function tryRenderAdminTools() {
        if (redirectUnauthorizedAdminToolsAccess()) return;
        bindStaticModalClosers();
        if (typeof renderLuxuryAdminToolsPage === 'function') {
            renderLuxuryAdminToolsPage();
            return true;
        }
        return false;
    }

    function initStandaloneAdminToolsRoute() {
        if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
        window.bootStandaloneDesktopRoute({
            entryId: 'admin-tools',
            pageId: 'admin-tools',
            family: 'admin',
            renderContent: function renderAdminToolsRouteContent() {
                if (!tryRenderAdminTools()) {
                    window.addEventListener('load', tryRenderAdminTools, { once: true });
                }
            },
            routeRefresh: function refreshAdminToolsRoute() {
                tryRenderAdminTools();
            }
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStandaloneAdminToolsRoute, { once: true });
    } else {
        initStandaloneAdminToolsRoute();
    }
})();
</script>
