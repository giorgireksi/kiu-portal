    <script>
        function initStandaloneStaffRoute() {
            if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
            window.bootStandaloneDesktopRoute({
                entryId: 'staff',
                pageId: 'staff',
                family: 'admin',
                renderContent: () => {
                    if (typeof renderStaffPage === 'function') renderStaffPage();
                },
                routeRefresh: () => {
                    if (typeof renderStaffPage === 'function') renderStaffPage();
                }
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initStandaloneStaffRoute, { once: true });
        } else {
            initStandaloneStaffRoute();
        }
    </script>
