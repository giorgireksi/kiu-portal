function initStandaloneNewsRoute() {
    if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
    window.bootStandaloneDesktopRoute({
        entryId: 'news',
        pageId: 'news',
        family: 'support',
        renderContent: function renderNewsRouteContent() {
            if (typeof window.renderNewsWorkspace === 'function') {
                window.renderNewsWorkspace();
            }
        },
        routeRefresh: function refreshNewsRoute() {
            if (typeof window.refreshNewsWorkspace === 'function') {
                window.refreshNewsWorkspace();
            } else if (typeof window.renderNewsWorkspace === 'function') {
                window.renderNewsWorkspace();
            }
        }
    });
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStandaloneNewsRoute, { once: true });
} else {
    initStandaloneNewsRoute();
}
</script>
