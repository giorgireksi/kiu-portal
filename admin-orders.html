<!-- COLOUR & MOTION STUDIO PANEL (Transparency Control) -->
<div id="modal-studio" class="modal-content admin-orders-studio" data-lux-transparency-exempt="1">
    <div class="modal-header admin-orders-studio-header">
        <h3 class="admin-orders-studio-title"><i class="fas fa-palette"></i> Colour &amp; Motion Studio</h3>
        <i class="fas fa-times modal-close admin-orders-studio-close" data-admin-orders-close-modal="true"></i>
    </div>
    <div class="modal-body admin-orders-studio-body">

        <!-- CURATED PALETTES -->
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline is-spacious">Curated Palettes</div>
            <div class="admin-orders-palette-grid">
                <button class="palette-btn admin-orders-palette-option is-obsidian-amber" type="button" data-admin-orders-palette="obsidian-amber">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Obsidian &amp; Amber</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-slate-sapphire" type="button" data-admin-orders-palette="slate-sapphire">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Slate &amp; Sapphire</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-pine-jade" type="button" data-admin-orders-palette="pine-jade">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Pine &amp; Jade</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-burgundy-rose" type="button" data-admin-orders-palette="burgundy-rose">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Burgundy &amp; Rose</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-sand-pearl" type="button" data-admin-orders-palette="sand-pearl">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Sand &amp; Pearl</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-ink-orchid" type="button" data-admin-orders-palette="ink-orchid">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Ink &amp; Orchid</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-ocean-teal" type="button" data-admin-orders-palette="ocean-teal">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Ocean &amp; Teal</span>
                    </span>
                </button>
                <button class="palette-btn admin-orders-palette-option is-platinum-silver" type="button" data-admin-orders-palette="platinum-silver">
                    <span class="admin-orders-palette-swatch">
                        <span class="admin-orders-palette-swatch-label">Silver</span>
                    </span>
                </button>
            </div>
        </div>

        <!-- INTERFACE MODE -->
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline">Interface Mode</div>
            <div class="admin-orders-mode-row">
                <button type="button" class="admin-orders-mode-btn" data-admin-orders-interface-mode="dark"><i class="fas fa-moon"></i> Dark</button>
                <button type="button" class="admin-orders-mode-btn" data-admin-orders-interface-mode="light"><i class="fas fa-sun"></i> Light</button>
            </div>
        </div>

        <!-- PANEL TRANSPARENCY -->
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline is-spacious">Panel Transparency</div>
            <div class="admin-orders-studio-card">
                <div class="admin-orders-range-head">
                    <label class="admin-orders-range-label"><i class="fas fa-layer-group"></i>Opacity Level</label>
                    <span id="transparency-display" class="admin-orders-range-value">70%</span>
                </div>
                <input type="range" id="transparency-slider" min="0" max="100" value="70" class="admin-orders-range-input is-spaced" data-admin-orders-transparency="true">
                <div class="admin-orders-range-legend">
                    <span><i class="fas fa-eye"></i> Full Transparent (0%)</span>
                    <span><i class="fas fa-eye-slash"></i> Solid (100%)</span>
                </div>
            </div>
        </div>

        <!-- 3D BACKGROUND -->
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline">3D Background</div>
            <div class="admin-orders-background-list">
                <button type="button" class="admin-orders-background-btn" data-admin-orders-background="peak">
                    <span class="admin-orders-background-title"><i class="fas fa-th"></i> Constellation Veil</span>
                    <span class="admin-orders-background-copy">Floating depth nodes with cinematic glow</span>
                </button>
                <button type="button" class="admin-orders-background-btn" data-admin-orders-background="aurora">
                    <span class="admin-orders-background-title"><i class="fas fa-wind"></i> Aurora Drift</span>
                    <span class="admin-orders-background-copy">Luminous atmospheric ribbons behind the dashboard</span>
                </button>
                <button type="button" class="admin-orders-background-btn" data-admin-orders-background="horizon">
                    <span class="admin-orders-background-title"><i class="fas fa-project-diagram"></i> Horizon Mesh</span>
                    <span class="admin-orders-background-copy">Prestige wireframe depth with calmer motion</span>
                </button>
            </div>
        </div>
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline">Background Animation</div>
            <div class="admin-orders-mode-row">
                <button type="button" class="admin-orders-mode-btn" data-admin-orders-background-animation="on"><i class="fas fa-play"></i> On</button>
                <button type="button" class="admin-orders-mode-btn" data-admin-orders-background-animation="off"><i class="fas fa-pause"></i> Off</button>
            </div>
        </div>

        <!-- CUSTOM ACCENT MIX -->
        <div class="admin-orders-studio-section">
            <div class="admin-orders-studio-overline is-spacious">Custom Accent Mix</div>
            <div class="admin-orders-studio-card">
                <div class="admin-orders-studio-section">
                    <div class="admin-orders-range-head">
                        <label class="admin-orders-range-label">Hue</label>
                        <span id="hue-display" class="admin-orders-range-value">0 deg</span>
                    </div>
                    <input type="range" id="hue-slider" min="0" max="360" value="156" class="admin-orders-range-input" data-admin-orders-custom-color="true">
                </div>
                <div class="admin-orders-studio-section">
                    <div class="admin-orders-range-head">
                        <label class="admin-orders-range-label">Saturation</label>
                        <span id="sat-display" class="admin-orders-range-value">72%</span>
                    </div>
                    <input type="range" id="sat-slider" min="0" max="100" value="72" class="admin-orders-range-input" data-admin-orders-custom-color="true">
                </div>
                <div class="admin-orders-studio-section">
                    <div class="admin-orders-range-head">
                        <label class="admin-orders-range-label">Lightness</label>
                        <span id="light-display" class="admin-orders-range-value">34%</span>
                    </div>
                    <input type="range" id="light-slider" min="0" max="100" value="34" class="admin-orders-range-input" data-admin-orders-custom-color="true">
                </div>
                <div id="hsl-display" class="admin-orders-hsl-preview">hsl(156, 72%, 34%)</div>
                <button type="button" class="admin-orders-apply-btn" data-admin-orders-apply-custom-color="true">Apply Custom Mix</button>
            </div>
        </div>
    </div>
</div>
