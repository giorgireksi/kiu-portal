    <!-- MAIN CONTENT -->
    <main id="app-content">
        <div id="page-profile" class="page-section active-page">
            <div class="page-hero">
                <div class="page-hero-title">Profile and Account Security</div>
                <div class="page-hero-copy">Manage core profile details, institutional email access, and account-security settings from a cleaner personal account workspace.</div>
                <div class="page-hero-meta">
                    <span class="page-hero-badge"><i class="far fa-user"></i> Profile details</span>

                </div>
            </div>
            <div class="profile-shell-layout">
                <div class="profile-shell-nav">
                    <div class="content-box surface-card">

                        <div class="tab profile-shell-tab" data-profile-tab="password"><i class="fas fa-lock profile-shell-tab-default-icon"></i> Password Change</div>
                        <div class="tab profile-shell-tab" data-profile-tab="calendar"><i class="fas fa-calendar profile-shell-tab-default-icon"></i> My Timetable</div>
                    </div>
                </div>
                <div class="profile-shell-content">
                    <div id="profile-section-title" class="profile-section-title">Profile</div>
                    <div class="content-box surface-card profile-shell-card">
                        <!-- Info Tab -->
                        <div id="profile-tab-info" data-profile-mounted="1">
                            <div class="profile-form-group">
                                <input id="profile-id-input" type="text" value="595365253" readonly>
                            </div>
                            <button class="kiu-btn-blue profile-shell-action" type="button">Update</button>
                        </div>
                        <!-- Email Tab -->
                        <div id="profile-tab-email" data-profile-mounted="0" class="profile-shell-lazy-pane"></div>
                        <template id="profile-tab-template-email">
                            <div class="profile-form-group">
                                <input id="profile-email-input" type="text" value="Babunashvili.Giorgi@kiu.edu.ge" readonly>
                            </div>
                            <button class="kiu-btn-blue profile-shell-action" type="button">Update</button>
                        </template>
                        <!-- Password Tab -->
                        <div id="profile-tab-password" data-profile-mounted="0" class="profile-shell-lazy-pane"></div>
                        <template id="profile-tab-template-password">
                            <div class="profile-form-group"><input type="password" autocomplete="current-password" placeholder="Current password"></div>
                            <div class="profile-form-group"><input type="password" autocomplete="new-password" placeholder="New password, min. 6 characters"></div>
                            <div class="profile-form-group"><input type="password" autocomplete="new-password" placeholder="Repeat password"></div>
                            <div class="profile-password-helper">
                                <div class="profile-password-toggle"><div class="profile-password-toggle-thumb"></div></div>
                                Password recovery uses your registered mobile number.<br>Contact KIU support if you need an SMS reset code.
                            </div>
                            <button class="profile-shell-disabled-action" type="button">Update</button>
                        </template>
                        <!-- Calendar Tab -->
                        <div id="profile-tab-calendar" class="profile-shell-calendar" data-profile-mounted="0"></div>
                        <template id="profile-tab-template-calendar">
                            <div id="profile-calendar-container" class="profile-shell-calendar-root"></div>
                        </template>
                    </div>
                    <div id="portal-messenger-container" class="content-box surface-card profile-shell-messenger">
                        Loading messenger...
                    </div>
                </div>
            </div>
        </div>
    </main>
