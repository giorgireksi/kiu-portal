<script>
(function bootStandaloneLibraryPage() {
    function ensureLibraryRouteVisualState() {
        var body = document.body;
        if (!body) return;
        body.classList.remove('kiu-shell-loading', 'lux-home-page');
        body.classList.add('lux-unified-shell', 'lux-nonhome-page', 'lux-route-library', 'lux-site-modernized');
        body.dataset.luxPage = 'library';
        body.dataset.luxEntry = 'library';
        body.dataset.luxFamily = 'support';
        if (!body.dataset.luxBackgroundMode) {
            body.dataset.luxBackgroundMode = localStorage.getItem('kiuLuxuryBackgroundMode') || 'constellation';
        }
        document.documentElement.dataset.luxPage = 'library';
    }

    function syncLibraryVisualShell() {
        ensureLibraryRouteVisualState();
        if (typeof window.updateTransparency === 'function') {
            var savedTransparency = parseInt(localStorage.getItem('kiuLuxurySurfaceTransparency') || '70', 10);
            if (!Number.isNaN(savedTransparency)) {
                window.updateTransparency(savedTransparency);
            }
        } else if (typeof window.refreshLuxuryTransparencySurfaces === 'function') {
            window.refreshLuxuryTransparencySurfaces();
        }
        var activeBackgroundMode = document.body && document.body.dataset.luxBackgroundMode
            || localStorage.getItem('kiuLuxuryBackgroundMode')
            || 'constellation';
        if (typeof window.__kiuRefreshLuxuryBackground === 'function') {
            window.__kiuRefreshLuxuryBackground(activeBackgroundMode);
        }
    }

    function bootLibrary() {
        ensureLibraryRouteVisualState();
        if (typeof window.renderLibraryPage === 'function') {
            window.renderLibraryPage();
        } else if (typeof window.renderLibraryPageShellContext === 'function') {
            window.renderLibraryPageShellContext();
        }
        syncLibraryVisualShell();
        requestAnimationFrame(syncLibraryVisualShell);
        window.setTimeout(syncLibraryVisualShell, 80);
        window.setTimeout(syncLibraryVisualShell, 240);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootLibrary);
    } else {
        bootLibrary();
    }

    window.addEventListener('pageshow', syncLibraryVisualShell);
    window.addEventListener('focus', syncLibraryVisualShell);
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) syncLibraryVisualShell();
    });
})();
</script>
