<script>
function initStandaloneLibraryRoute() {
    if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
    window.bootStandaloneDesktopRoute({
        entryId: 'library',
        pageId: 'library',
        family: 'support',
        renderContent: function renderLibraryRouteContent() {
            if (typeof window.renderLibraryPage === 'function') {
                window.renderLibraryPage();
            }
        },
        routeRefresh: function refreshLibraryRoute() {
            if (typeof window.renderLibraryPage === 'function') {
                window.renderLibraryPage();
            } else if (typeof window.renderLibraryPageShellContext === 'function') {
                window.renderLibraryPageShellContext();
            }
        },
        afterRender: function finalizeLibraryRoute() {
            const deferred = typeof window.loadDeferredLibraryScripts === 'function'
                ? window.loadDeferredLibraryScripts()
                : Promise.resolve();
            return Promise.resolve(deferred).finally(() => {
                if (typeof window.markPortalShellReady === 'function') {
                    window.markPortalShellReady();
                }
            });
        }
    });
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStandaloneLibraryRoute, { once: true });
} else {
    initStandaloneLibraryRoute();
}
</script>
