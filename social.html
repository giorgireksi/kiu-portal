<script>
(function resetLocalPortalWorkerForSocialRoute() {
    try {
        const host = String(window.location.hostname || '').toLowerCase();
        if (host !== '127.0.0.1' && host !== 'localhost') return;
        if (!('serviceWorker' in navigator) || typeof caches === 'undefined') return;
        const marker = 'KIU_SOCIAL_ROUTE_SW_RESET_20260606-postactions6';
        if (sessionStorage.getItem(marker) === '1') return;
        sessionStorage.setItem(marker, '1');
        Promise.all([
            navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all((registrations || []).map((registration) => registration.unregister().catch(() => false)))
            ).catch(() => null),
            caches.keys().then((keys) =>
                Promise.all((keys || []).filter((key) => String(key || '').startsWith('kiu-portal-shell-')).map((key) => caches.delete(key)))
            ).catch(() => null)
        ]).finally(() => {
            window.location.replace(`${window.location.pathname}?swreset=${Date.now()}`);
        });
    } catch (error) {}
})();
</script>
