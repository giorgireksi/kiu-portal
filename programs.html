<script>
/* Boot academic programs view on standalone load */
(function() {
    function initStandaloneProgramsRoute() {
        if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
        window.bootStandaloneDesktopRoute({
            entryId: 'programs',
            pageId: 'programs',
            family: 'academic',
            renderContent: function renderProgramsRouteContent() {
                if (typeof renderStudentEducationalProgramPage === 'function') {
                    renderStudentEducationalProgramPage();
                }
            },
            routeRefresh: function refreshProgramsRoute() {
                if (typeof renderStudentEducationalProgramPage === 'function') {
                    renderStudentEducationalProgramPage();
                }
            }
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStandaloneProgramsRoute, { once: true });
    } else {
        initStandaloneProgramsRoute();
    }
})();
</script>
