    <script>
        function initStandaloneStudentsAdminRoute() {
            if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
            window.bootStandaloneDesktopRoute({
                entryId: 'students-admin',
                pageId: 'students-admin',
                family: 'admin',
                beforeBoot: () => {
                    const faculty = localStorage.getItem('currentFaculty') || 'ECON';
                    if (typeof switchFacultyTheme === 'function') switchFacultyTheme(faculty, { refreshDependentViews: false });
                },
                renderContent: () => {
                    if (typeof renderStudentsPage === 'function') renderStudentsPage();
                },
                routeRefresh: () => {
                    if (typeof renderStudentsPage === 'function') renderStudentsPage();
                }
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initStandaloneStudentsAdminRoute, { once: true });
        } else {
            initStandaloneStudentsAdminRoute();
        }
    </script>
