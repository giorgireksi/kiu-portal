<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Particle Wave Background Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="wave-canvas" aria-hidden="true"></canvas>

    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">Procedural background prototype</p>
        <h1>Animated particle waves for a website backdrop</h1>
        <p class="lede">
          Original WebGL particles. No source image, trademarks, or watermark.
        </p>

        <div class="controls" aria-label="Background controls">
          <label>
            Variant
            <select id="variant-select">
              <option value="peak">Peak Terrain</option>
              <option value="layered">Layered Waves</option>
              <option value="orbit">Orbit Field</option>
              <option value="corners">Corner Focus</option>
            </select>
          </label>

          <label>
            Theme
            <select id="theme-select">
              <option value="mono">Monochrome</option>
              <option value="cyan">Cyan</option>
              <option value="gold">Gold</option>
              <option value="violet">Violet</option>
              <option value="emerald">Emerald</option>
            </select>
          </label>

          <label class="motion-control">
            Motion
            <input id="motion-slider" type="range" min="0" max="120" value="72" />
          </label>

          <label>
            Density
            <input id="density-slider" type="range" min="35" max="100" value="82" />
          </label>

          <label>
            Quality
            <select id="quality-select">
              <option value="auto">Auto</option>
              <option value="low">Low</option>
              <option value="balanced">Balanced</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
