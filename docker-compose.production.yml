services:
  caddy:
    image: caddy:2.9-alpine
    container_name: kiu-portal-caddy
    restart: unless-stopped
    environment:
      KIU_PUBLIC_HOSTNAME: ${KIU_PUBLIC_HOSTNAME:?KIU_PUBLIC_HOSTNAME is required}
    ports:
      - "127.0.0.1:${KIU_WEB_PORT:-8900}:80"
    volumes:
      - ./:/srv:ro
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portal-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  portal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiu-portal-platform:production
    container_name: kiu-portal-backend
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["sh", "-c", "node tools/check-production-readiness.js && node tools/migrate-postgres.js && exec node backend/platform/server.js"]
    # Match the env file selected by start-selfhosted-production.sh. A fixed
    # .env.production here silently ignored KIU_PRODUCTION_ENV_FILE.
    env_file:
      - ${KIU_PRODUCTION_ENV_FILE:-.env.production}
    expose:
      - "47833"
    volumes:
      - portal_uploads:/app/kiu-realtime-bridge/uploads
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47833/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: kiu-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    shm_size: 256m
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  portal_uploads:
