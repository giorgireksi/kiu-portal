services:
  caddy:
    image: caddy:2.9-alpine
    container_name: kiu-portal-caddy
    restart: unless-stopped
    environment:
      KIU_PUBLIC_HOSTNAME: ${KIU_PUBLIC_HOSTNAME:?KIU_PUBLIC_HOSTNAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/srv:ro
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal-backend

  portal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiu-portal-platform:production
    container_name: kiu-portal-backend
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["sh", "-c", "node tools/migrate-postgres.js && exec node backend/platform/server.js"]
    env_file:
      - .env.production
    expose:
      - "47833"
    volumes:
      - portal_uploads:/app/kiu-realtime-bridge/uploads
    secrets:
      - firebase_service_account
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47833/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: kiu-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:4.7
    container_name: kiu-portal-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      KIU_TURN_USERNAME: ${KIU_TURN_USERNAME:?KIU_TURN_USERNAME is required}
      KIU_TURN_CREDENTIAL: ${KIU_TURN_CREDENTIAL:?KIU_TURN_CREDENTIAL is required}
      KIU_TURN_REALM: ${KIU_TURN_REALM:?KIU_TURN_REALM is required}
      KIU_TURN_SERVER_NAME: ${KIU_TURN_SERVER_NAME:?KIU_TURN_SERVER_NAME is required}
      KIU_TURN_EXTERNAL_IP: ${KIU_TURN_EXTERNAL_IP:?KIU_TURN_EXTERNAL_IP is required}
    volumes:
      - ./infra/coturn/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro
      - ${KIU_TURN_CERT_HOST_PATH:?KIU_TURN_CERT_HOST_PATH is required}:/etc/coturn/turn-cert.pem:ro
      - ${KIU_TURN_KEY_HOST_PATH:?KIU_TURN_KEY_HOST_PATH is required}:/etc/coturn/turn-key.pem:ro
    command:
      - /bin/sh
      - -c
      - >
        sed
        -e "s|__TURN_USERNAME__|$${KIU_TURN_USERNAME}|g"
        -e "s|__TURN_CREDENTIAL__|$${KIU_TURN_CREDENTIAL}|g"
        -e "s|__TURN_REALM__|$${KIU_TURN_REALM}|g"
        -e "s|__TURN_SERVER_NAME__|$${KIU_TURN_SERVER_NAME}|g"
        -e "s|__TURN_EXTERNAL_IP__|$${KIU_TURN_EXTERNAL_IP}|g"
        -e "s|__TURN_CERT_FILE__|/etc/coturn/turn-cert.pem|g"
        -e "s|__TURN_KEY_FILE__|/etc/coturn/turn-key.pem|g"
        /etc/coturn/turnserver.conf.template > /tmp/turnserver.conf
        && turnserver -c /tmp/turnserver.conf

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  portal_uploads:

secrets:
  firebase_service_account:
    file: ${KIU_FIREBASE_SERVICE_ACCOUNT_HOST_PATH:?KIU_FIREBASE_SERVICE_ACCOUNT_HOST_PATH is required}
