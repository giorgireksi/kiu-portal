<script>
function initStandaloneExamsRoute() {
    if (typeof window.bootStandaloneDesktopRoute !== 'function') return;
    window.bootStandaloneDesktopRoute({
        entryId: 'exams',
        pageId: 'exams',
        family: 'faculty',
        renderContent: function renderExamsRouteContent() {
            if (typeof window.renderAdminExamSection === 'function') {
                window.renderAdminExamSection();
            }
        }
    });
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStandaloneExamsRoute, { once: true });
} else {
    initStandaloneExamsRoute();
}
</script>
<script>
    (function initExamExportLibraryLoader() {
        const exportSources = {
            jspdf: 'assets/vendor/export-libs/jspdf.umd.min.js',
            docx: 'assets/vendor/export-libs/docx.iife.js',
            fileSaver: 'assets/vendor/export-libs/FileSaver.min.js'
        };
        const pendingLoads = {};
        const isReady = {
            jspdf: () => typeof window.jspdf !== 'undefined' || typeof window.jsPDF !== 'undefined',
            docx: () => typeof window.docx !== 'undefined',
            fileSaver: () => typeof window.saveAs === 'function'
        };

        function loadScriptOnce(key) {
            if (isReady[key]?.()) return Promise.resolve();
            if (pendingLoads[key]) return pendingLoads[key];
            pendingLoads[key] = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = exportSources[key];
                script.async = true;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Could not load ${key} export library.`));
                document.head.appendChild(script);
            });
            return pendingLoads[key];
        }

        window.ensureExamExportLibraries = function ensureExamExportLibraries(format) {
            const normalized = String(format || '').toLowerCase();
            if (normalized === 'pdf') return loadScriptOnce('jspdf');
            if (normalized === 'docx') return Promise.all([loadScriptOnce('docx'), loadScriptOnce('fileSaver')]);
            return Promise.resolve();
        };
    })();
</script>
